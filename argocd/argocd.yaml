apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: micro-feature-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hemaswathi2002/microservice-deployment
    targetRevision: HEAD
    path: microservice-app/helm-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true